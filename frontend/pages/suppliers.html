<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suppliers - Sales Management System</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Sales Management</h2>

        <nav>

            <a href="dashboard.html">Dashboard</a>

            <a href="products.html">Products</a>

            <a href="categories.html">Categories</a>

            <a href="customers.html">Customers</a>

            <a href="suppliers.html" class="active">
                Suppliers
            </a>

            <a href="sales.html">Sales</a>

            <a href="purchases.html">Purchases</a>

            <a href="inventory.html">Inventory</a>

            <a href="invoices.html">Invoices</a>

            <a href="reports.html">Reports</a>

        </nav>

        <a href="login.html" class="logout-btn">
            Logout
        </a>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <div class="topbar">

            <h1>Suppliers</h1>

            <p>Manage suppliers</p>

        </div>


        <!-- Add Supplier -->
        <section class="content-section">

            <h2>Add Supplier</h2>

            <form id="supplierForm" class="form-grid">


                <!-- Supplier Name -->
                <div class="form-group">

                    <label for="supplierName">
                        Supplier Name
                    </label>

                    <input
                        type="text"
                        id="supplierName"
                        name="supplier_name"
                        placeholder="Enter supplier name"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="supplierPhone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="supplierPhone"
                        name="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="supplierEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="supplierEmail"
                        name="email"
                        placeholder="Enter email"
                    >

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="supplierAddress">
                        Address
                    </label>

                    <input
                        type="text"
                        id="supplierAddress"
                        name="address"
                        placeholder="Enter address"
                    >

                </div>


                <!-- Button -->
                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Add Supplier
                    </button>

                </div>

            </form>


            <p id="supplierMessage"></p>

        </section>


        <!-- Supplier List -->
        <section class="content-section">

            <div class="section-header">

                <h2>Supplier List</h2>

                <input
                    type="text"
                    id="supplierSearch"
                    class="search-input"
                    placeholder="Search supplier..."
                >

            </div>


            <table class="data-table">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Supplier Name</th>

                        <th>Phone</th>

                        <th>Email</th>

                        <th>Address</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="supplierTableBody">

                    <tr>

                        <td colspan="6">
                            No suppliers available
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>


<script src="../js/products.js"></script>
<script src="../js/access-control.js"></script>

</body>
</html>
