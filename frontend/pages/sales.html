<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales - Sales Management System</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Sales Management</h2>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="customers.html">
                Customers
            </a>

            <a href="suppliers.html">
                Suppliers
            </a>

            <a href="sales.html" class="active">
                Sales
            </a>

            <a href="purchases.html">
                Purchases
            </a>

            <a href="inventory.html">
                Inventory
            </a>

            <a href="invoices.html">
                Invoices
            </a>

            <a href="reports.html">
                Reports
            </a>

        </nav>

        <a href="login.html" class="logout-btn">
            Logout
        </a>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <div class="topbar">

            <h1>Sales</h1>

            <p>Record and manage sales</p>

        </div>


        <!-- Record Sale -->
        <section class="content-section">

            <h2>Record Sale</h2>

            <form id="salesForm" class="form-grid">


                <!-- Customer -->
                <div class="form-group">

                    <label for="customer">
                        Customer
                    </label>

                    <select
                        id="customer"
                        name="customer_id"
                    >

                        <option value="">
                            Select Customer
                        </option>

                    </select>

                </div>


                <!-- Product -->
                <div class="form-group">

                    <label for="product">
                        Product
                    </label>

                    <select
                        id="product"
                        name="product_id"
                        required
                    >

                        <option value="">
                            Select Product
                        </option>

                    </select>

                </div>


                <!-- Quantity -->
                <div class="form-group">

                    <label for="saleQuantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="saleQuantity"
                        name="quantity"
                        min="1"
                        placeholder="Enter quantity"
                        required
                    >

                </div>


                <!-- Price -->
                <div class="form-group">

                    <label for="salePrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="salePrice"
                        name="price"
                        step="0.01"
                        placeholder="Enter price"
                        required
                    >

                </div>


                <!-- Total -->
                <div class="form-group">

                    <label for="saleTotal">
                        Total
                    </label>

                    <input
                        type="number"
                        id="saleTotal"
                        name="total"
                        step="0.01"
                        placeholder="Total amount"
                        readonly
                    >

                </div>


                <!-- Button -->
                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Record Sale
                    </button>

                </div>

            </form>


            <p id="salesMessage"></p>

        </section>


        <!-- Sales List -->
        <section class="content-section">

            <div class="section-header">

                <h2>Sales List</h2>

                <input
                    type="text"
                    id="salesSearch"
                    class="search-input"
                    placeholder="Search sales..."
                >

            </div>


            <table class="data-table">

                <thead>

                    <tr>

                        <th>Sale ID</th>

                        <th>Customer</th>

                        <th>Product</th>

                        <th>Quantity</th>

                        <th>Price</th>

                        <th>Total</th>

                        <th>Sale Date</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="salesTableBody">

                    <tr>

                        <td colspan="8">
                            No sales available
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>


<script src="../js/sales.js"></script>
<script src="../js/access-control.js"></script>

</body>
</html>
